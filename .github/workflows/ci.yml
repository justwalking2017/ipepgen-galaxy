name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[workflow]" pytest
      - run: ipepgen validate
      - run: pytest -q
      - run: snakemake --snakefile workflow/Snakefile --configfile workflow/config/config.example.yaml --dry-run --cores 1
      - run: snakemake --snakefile hpc/Snakefile --configfile hpc/tests/config.yaml --dry-run --cores 2
      - run: python -m compileall -q hpc/scripts
      - run: docker build -t ipepgen-galaxy:test .
      - run: docker run --rm ipepgen-galaxy:test validate
