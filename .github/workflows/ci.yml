name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e . pytest
      - run: ipepgen validate
      - run: pytest -q
      - run: docker build -t ipepgen-galaxy:test .
      - run: docker run --rm ipepgen-galaxy:test validate

