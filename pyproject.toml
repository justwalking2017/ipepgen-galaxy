[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ipepgen-galaxy"
version = "0.3.0"
description = "Reproducible Galaxy workflow bundle and CLI for the iPepGen pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "iPepGen Galaxy workflow bundle contributors"}]
dependencies = ["bioblend>=1.9,<2"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]

[project.scripts]
ipepgen = "ipepgen.cli:main"

[project.optional-dependencies]
workflow = ["snakemake>=9,<10", "snakemake-executor-plugin-slurm>=2,<3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
